<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GitLab Look</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="popup-header">
      <img src="../icons/icon48.png" width="28" height="28" alt="" />
      <div>
        <h1>GitLab Look</h1>
        <p>Maturity Builder GitLab Overlay skin. Focuses security and workflow efficiency.</p>
      </div>
    </header>
    <label class="toggle">
      <input id="enabled" type="checkbox" />
      <span class="track" aria-hidden="true"></span>
      <span class="label">Show GitLab look</span>
    </label>
    <fieldset class="theme">
      <legend>Appearance</legend>
      <div class="theme-options" role="radiogroup" aria-label="Appearance">
        <label>
          <input type="radio" name="theme" value="light" />
          <span>Light</span>
        </label>
        <label>
          <input type="radio" name="theme" value="dark" />
          <span>Dark</span>
        </label>
        <label>
          <input type="radio" name="theme" value="system" />
          <span>System</span>
        </label>
      </div>
    </fieldset>
    <p class="hint">Light, Dark, or System follows this browser. Oldest / Newest on a pull request is remembered here too.</p>
    <script src="popup.js"></script>
  </body>
</html>
