<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GitLab look harness</title>
  </head>
  <body>
    <pre id="out"></pre>
    <script src="../extension/content/pipeline.js"></script>
    <script src="../extension/content/comments.js"></script>
    <script src="../extension/content/vulns.js"></script>
    <script src="../extension/content/content.js"></script>
    <script>
      const failures = [];
      function assert(condition, message) {
        if (!condition) failures.push(message);
      }
      try {

      assert(GitLabLook.parseStatus("completed successfully: ") === "success", "success status");
      assert(GitLabLook.parseStatus("failed: ") === "failed", "failed status");
      assert(GitLabLook.parseStatus("in progress: ") === "running", "running status");
      assert(GitLabLook.parseStatus("skipped: ") === "skipped", "skipped status");

      const staged = GitLabLook.groupIntoStages(
        GitLabLook.topologicalColumns([
          { id: "build", name: "build", status: "success", needs: [], href: "/job/1", duration: "30s" },
          { id: "n18", name: "test / node 18", status: "failed", needs: ["build"], href: "/job/2", duration: "" },
          { id: "n20", name: "test / node 20", status: "success", needs: ["build"], href: "/job/3", duration: "" },
          { id: "deploy", name: "deploy", status: "running", needs: ["n18", "n20"], href: "/job/4", duration: "2m" },
        ])
      );
      assert(staged.map((stage) => stage.name).join(",") === "build,test,deploy", "stage names: " + staged.map((stage) => stage.name).join(","));
      assert(staged[1].status === "failed", "test stage worst status");
      assert(staged[1].jobs.length === 2, "matrix jobs share a stage");
      assert(GitLabLook.groupJobsByStage([
        { name: "build (ubuntu-latest)", status: "success" },
        { name: "build (windows-latest)", status: "failed" },
        { name: "integration-tests (ubuntu-latest)", status: "success" },
        { name: "check-requirements / lint", status: "success" },
      ]).map((stage) => stage.name + ":" + stage.jobs.length + ":" + stage.status).join(",") ===
        "build:2:failed,integration-tests:1:success,check-requirements:1:success", "named stages");
      assert(GitLabLook.versionInRange("4.17.20", "< 4.17.21"), "vulnerable version in range");
      assert(!GitLabLook.versionInRange("4.17.21", "< 4.17.21"), "patched version outside range");
      assert(GitLabLook.fileMatchesManifest("package.json", "package.json"), "manifest matches itself");
      assert(GitLabLook.fileMatchesManifest("package-lock.json", "package.json"), "lockfile matches package manifest");
      assert(!GitLabLook.fileMatchesManifest("README.md", "package.json"), "readme is not a manifest");

      document.body.dataset.glPath = "/acme/widgets";
      document.body.innerHTML = [
        '<header role="banner"><input name="q" /></header>',
        '<nav aria-label="Repository" class="js-repo-nav">',
        '<a id="code-tab" href="/acme/widgets"><span data-content="Code">Code</span></a>',
        '<a id="issues-tab" href="/acme/widgets/issues"><span data-content="Issues">Issues</span><span id="issues-repo-tab-count" title="1,039" class="Counter">1k</span></a>',
        '<a id="pull-requests-tab" href="/acme/widgets/pulls"><span data-content="Pull requests">Pull requests</span><span id="pull-requests-repo-tab-count" title="74" class="Counter">74</span></a>',
        '<a id="actions-tab" href="/acme/widgets/actions"><span data-content="Actions">Actions</span></a>',
        '<a id="wiki-tab" href="/acme/widgets/wiki">Wiki</a>',
        '<a id="insights-tab" href="/acme/widgets/pulse">Insights</a>',
        '<a id="settings-tab" href="/acme/widgets/settings">Settings</a>',
        "</nav>",
        "<h1>Pull requests</h1>",
      ].join("");
      document.title = "Pull requests · acme/widgets · GitHub";
      GitLabLook.render(document, { enabled: true, commentOrder: "asc" });
      assert(document.documentElement.classList.contains("gl-look"), "skin class");
      assert(document.documentElement.classList.contains("gl-look-repo"), "repo class");
      function navLabels() {
        return [...document.querySelectorAll("#gl-sidebar .gl-nav a")].map((node) => node.querySelector(".gl-nav-label").textContent);
      }
      const labels = navLabels();
      assert(labels.join("|") === "Repository|Issues|Merge requests|CI/CD|Wiki|Insights|Settings", "sidebar labels: " + labels.join("|"));
      assert(document.querySelector("#gl-sidebar .gl-nav a[aria-current='page'] .gl-nav-label").textContent === "Repository", "repo section active");
      assert(document.querySelector("#gl-sidebar a[data-section='issues'] .gl-count").textContent === "1k", "issue count");
      assert(document.querySelector("#gl-sidebar a[data-section='issues'] .gl-count").title === "1,039", "issue count title");
      assert(document.querySelector("#gl-sidebar a[data-section='pulls'] .gl-count").textContent === "74", "merge request count");
      assert(document.querySelector("#gl-sidebar a[data-section='pulls']").getAttribute("aria-label") === "Merge requests, 74", "merge request count label");
      assert(!document.querySelector("#gl-sidebar a[data-section='repo'] .gl-count"), "repository has no count");
      document.getElementById("pull-requests-repo-tab-count").textContent = "75";
      document.getElementById("pull-requests-repo-tab-count").title = "75";
      GitLabLook.render(document, { enabled: true, commentOrder: "asc" });
      assert(document.querySelector("#gl-sidebar a[data-section='pulls'] .gl-count").textContent === "75", "merge request count updates");
      assert(document.querySelector("h1").textContent === "Merge requests", "heading remap");
      assert(document.title.indexOf("Merge requests") === 0, "title remap: " + document.title);

      document.body.dataset.glPath = "/acme/widgets/pulls";
      GitLabLook.render(document, { enabled: true, commentOrder: "asc" });
      assert(document.querySelector("#gl-sidebar .gl-nav a[aria-current='page']").dataset.section === "pulls", "merge requests active");

      document.body.innerHTML = [
        '<nav aria-label="Repository">',
        '<a data-tab-item="code" href="/acme/widgets"><span data-component="text" data-content="Code">Code</span></a>',
        '<a data-tab-item="issues" href="/acme/widgets/issues"><span data-component="text" data-content="Issues">Issues</span><span data-component="counter"><span aria-hidden="true" data-component="CounterLabel">1k</span></span></a>',
        '<a data-tab-item="pull-requests" href="/acme/widgets/pulls"><span data-component="text" data-content="Pull requests">Pull requests</span><span data-component="counter"><span aria-hidden="true" data-component="CounterLabel">74</span></span></a>',
        '<a data-tab-item="actions" href="/acme/widgets/actions"><span data-component="text" data-content="Actions">Actions</span></a>',
        '<a data-tab-item="insights" href="/acme/widgets/pulse">Insights</a>',
        '<a data-tab-item="settings" href="/acme/widgets/settings">Settings</a>',
        "</nav>",
      ].join("");
      document.body.dataset.glPath = "/acme/widgets";
      document.title = "acme/widgets";
      GitLabLook.render(document, { enabled: true, commentOrder: "asc" });
      assert(document.querySelector("#gl-sidebar a[data-section='issues'] .gl-count").textContent === "1k", "primer issue count");
      assert(document.querySelector("#gl-sidebar a[data-section='pulls'] .gl-count").textContent === "74", "primer merge request count");

      document.body.innerHTML = [
        '<nav aria-label="Repository"><a id="code-tab" href="/acme/widgets">Code</a></nav>',
      ].join("");
      document.body.dataset.glPath = "/acme/widgets";
      GitLabLook.render(document, { enabled: true, commentOrder: "asc" });
      const noWiki = navLabels();
      assert(!noWiki.includes("Wiki"), "wiki omitted: " + noWiki.join("|"));
      assert(noWiki.includes("Settings"), "settings kept");

      document.body.dataset.glPath = "/acme/widgets/actions";
      document.body.innerHTML = [
        '<h1>Workflow runs</h1>',
        '<span class="ActionListItem-label">All workflows</span>',
        '<h3 class="ActionList-sectionDivider-title">Workflows</h3>',
        '<div class="Box-row">',
        '<a href="/acme/widgets/actions/runs/37147564835" aria-label="completed successfully: build">',
        '<svg aria-label="completed successfully: "></svg>',
        '<span class="h4 markdown-title">Add widget</span>',
        "</a>",
        "<span>#42604:</span>",
        '<a href="/acme/widgets/tree/main">main</a>',
        '<a data-hovercard-type="user" href="/octocat">octocat</a>',
        '<span><svg aria-label="Run duration"></svg>1m 4s</span>',
        "</div>",
      ].join("");
      GitLabLook.render(document, { enabled: true, commentOrder: "asc" });
      const row = document.querySelector(".gl-pipeline-row");
      assert(row, "pipeline row");
      assert(document.querySelector(".gl-pipeline-badge").textContent === "passed", "passed badge");
      assert(document.querySelector(".gl-pipeline-id").textContent === "#42604", "pipeline number");
      assert(document.querySelector(".gl-pipeline-id").getAttribute("href").indexOf("/actions/runs/37147564835") > -1, "run link");
      assert(document.querySelector(".gl-branch-pill").textContent === "main", "branch pill");
      assert(document.querySelector(".gl-pipeline-meta").textContent.indexOf("octocat") > -1, "actor");
      assert(document.querySelector(".gl-pipeline-meta").textContent.indexOf("1m 4s") > -1, "duration");
      assert(document.querySelector(".ActionListItem-label").textContent.trim() === "All pipelines", "all pipelines label");
      assert(document.querySelector("h1").textContent === "Pipelines", "pipeline heading");

      document.body.dataset.glPath = "/acme/widgets/actions/runs/42";
      document.body.innerHTML = [
        "<action-graph>",
        '<div class="WorkflowGraph">',
        '<div class="WorkflowStage">',
        '<streaming-graph-job data-job-id="build" data-needs="">',
        '<a href="/acme/widgets/actions/runs/42/job/1">',
        '<svg aria-label="completed successfully: "></svg>',
        '<span data-target="streaming-graph-job.name">build</span>',
        "</a>",
        '<span class="duration">30s</span>',
        "</streaming-graph-job>",
        "</div>",
        '<div class="WorkflowStage">',
        '<streaming-graph-job data-job-id="node18" data-needs="build">',
        '<a href="/acme/widgets/actions/runs/42/job/2">',
        '<svg aria-label="failed: "></svg>',
        '<span class="workflow-path-first-item" data-target="streaming-graph-job.name">test</span><span>/</span><span>node 18</span>',
        "</a>",
        "</streaming-graph-job>",
        '<streaming-graph-job data-job-id="node20" data-needs="build">',
        '<a href="/acme/widgets/actions/runs/42/job/3">',
        '<svg aria-label="completed successfully: "></svg>',
        '<span class="workflow-path-first-item" data-target="streaming-graph-job.name">test</span><span>/</span><span>node 20</span>',
        "</a>",
        "</streaming-graph-job>",
        "</div>",
        '<div class="WorkflowStage">',
        '<streaming-graph-job data-job-id="deploy" data-needs="node18,node20">',
        '<a href="/acme/widgets/actions/runs/42/job/4">',
        '<svg aria-label="in progress: "></svg>',
        '<span data-target="streaming-graph-job.name">deploy</span>',
        "</a>",
        '<span class="duration">2m</span>',
        "</streaming-graph-job>",
        "</div>",
        "</div>",
        "</action-graph>",
      ].join("");
      GitLabLook.render(document, { enabled: true, commentOrder: "asc" });
      const stageNames = [...document.querySelectorAll(".gl-stage-head span:first-child")].map((node) => node.textContent);
      assert(stageNames.join(",") === "build,test,deploy", "graph stages: " + stageNames.join(","));
      assert(document.querySelectorAll(".gl-stage")[1].querySelector(".gl-status").textContent === "failed", "column status");
      assert(document.querySelectorAll(".gl-job-pill").length === 4, "four job pills");
      assert(document.querySelector(".gl-job-pill[href$='/job/1'] .gl-job-duration").textContent === "30s", "job duration");
      assert(document.querySelector("action-graph").classList.contains("gl-native-graph-hidden"), "native graph hidden");

      document.body.dataset.glPath = "/acme/widgets/actions/runs/42/job/4";
      document.body.innerHTML = [
        '<a id="check-step-header-title"><span>deploy</span></a>',
        '<div class="js-check-steps"><svg aria-label="in progress: "></svg>',
        '<div class="js-check-step">Set up job</div>',
        '<div class="js-check-step">Run deploy</div>',
        "</div>",
      ].join("");
      GitLabLook.render(document, { enabled: true, commentOrder: "asc" });
      const jobBar = document.getElementById("gl-job-bar");
      assert(jobBar, "job bar");
      assert(jobBar.textContent.indexOf("deploy") > -1, "job name");
      assert(jobBar.textContent.indexOf("running") > -1, "job status");
      assert(jobBar.querySelector("a").textContent === "Pipeline #42", "pipeline back link");
      assert(jobBar.querySelector("a").getAttribute("href") === "/acme/widgets/actions/runs/42", "pipeline href");
      assert(document.querySelector(".js-check-step").textContent === "Set up job", "log text kept");

      document.body.dataset.glPath = "/acme/widgets/pull/7/checks";
      document.body.dataset.glSearch = "?check_run_id=11";
      document.body.innerHTML = [
        '<nav><a href="/acme/widgets/pull/7/checks">Checks</a></nav>',
        '<div class="d-flex">',
        '<aside class="js-check-suites-sidebar" aria-label="Check suites">',
        '<details class="checks-list-item" open>',
        '<summary><a href="/acme/widgets/actions/runs/99"><span>Unit and Integration Tests</span><span>on: pull_request</span></a></summary>',
        '<div class="checks-list-item"><span class="checks-list-item-icon"><svg aria-label="This job succeeded" class="octicon-check color-fg-success"></svg></span>',
        '<a href="/acme/widgets/actions/runs/99/job/10?pr=7"><span>build (ubuntu-latest)</span></a></div>',
        '<div class="checks-list-item"><span class="checks-list-item-icon"><svg aria-label="This job failed" class="octicon-x color-fg-danger"></svg></span>',
        '<a href="/acme/widgets/actions/runs/99/job/11?pr=7"><span>build (windows-latest)</span></a></div>',
        '<div class="checks-list-item"><span class="checks-list-item-icon"><svg aria-label="This job succeeded" class="octicon-check color-fg-success"></svg></span>',
        '<a href="/acme/widgets/actions/runs/99/job/12?pr=7"><span>integration-tests (ubuntu-latest)</span></a></div>',
        "</details>",
        '<details class="checks-list-item" open>',
        '<summary><a href="/acme/widgets/actions/runs/100"><span>PR Triaging</span></a></summary>',
        '<div class="checks-list-item"><span class="checks-list-item-icon"><svg aria-label="This job succeeded" class="octicon-check color-fg-success"></svg></span>',
        '<a href="/acme/widgets/actions/runs/100/job/20?pr=7"><span>label-external / label_issues</span></a></div>',
        '<div class="checks-list-item"><span class="checks-list-item-icon"><svg aria-label="This job succeeded" class="octicon-check color-fg-success"></svg></span>',
        '<a href="/acme/widgets/actions/runs/100/job/21?pr=7"><span>ready-for-review</span></a></div>',
        "</details>",
        "</aside>",
        '<div class="js-check-steps"><svg aria-label="failed: "></svg><div class="js-check-step">Run tests</div></div>',
        "</div>",
      ].join("");
      GitLabLook.render(document, { enabled: true, commentOrder: "asc" });
      const pipelines = document.querySelectorAll(".gl-mr-pipeline");
      assert(pipelines.length === 2, "check tab pipelines: " + pipelines.length);
      assert(document.querySelector(".gl-mr-pipelines-title").textContent === "Pipelines", "pipelines heading");
      assert(document.querySelector('a[href="/acme/widgets/pull/7/checks"]').textContent.trim() === "Pipelines", "checks tab relabel");
      assert(document.getElementById("gl-mr-rail").lastElementChild.id === "gl-mr-pipelines", "pipelines on the right");
      assert(!document.querySelector(".js-check-suites-sidebar").classList.contains("gl-native-checks-hidden"), "native checks kept");
      assert(document.getElementById("gl-security-tab").textContent.trim() === "Security", "security tab");
      const firstCard = pipelines[0];
      assert(firstCard.querySelector(".gl-pipeline-badge").textContent === "failed", "suite worst status");
      assert(firstCard.querySelector(".gl-pipeline-id").textContent === "#99", "suite pipeline id");
      assert(firstCard.querySelector(".gl-pipeline-subject").textContent === "Unit and Integration Tests", "suite name");
      const stageLabels = [...firstCard.querySelectorAll(".gl-mini-label")].map((node) => node.textContent);
      assert(stageLabels.join(",") === "build,integration-tests", "check tab stages: " + stageLabels.join(","));
      assert(firstCard.querySelector(".gl-mini-stage.is-open .gl-mini-label").textContent === "build", "failed stage open");
      assert(firstCard.querySelector(".gl-job-pill[aria-current='page'] .gl-job-name").textContent === "build (windows-latest)", "selected job");
      assert(document.getElementById("gl-job-bar").textContent.indexOf("build (windows-latest)") > -1, "checks job bar name");
      assert(document.getElementById("gl-job-bar").querySelector("a").textContent === "Pipeline #99", "checks job bar pipeline");
      firstCard.querySelector('.gl-mini-stage[data-stage="integration-tests"]').click();
      assert(firstCard.querySelector(".gl-mini-stage.is-open .gl-mini-label").textContent === "integration-tests", "stage click");
      assert(firstCard.querySelector(".gl-job-name").textContent === "integration-tests (ubuntu-latest)", "stage jobs");
      const secondStages = [...pipelines[1].querySelectorAll(".gl-mini-label")].map((node) => node.textContent);
      assert(secondStages.join(",") === "label-external,ready-for-review", "slash and plain stages: " + secondStages.join(","));
      GitLabLook.render(document, { enabled: false, commentOrder: "asc" });
      assert(!document.getElementById("gl-mr-pipelines"), "checks overlay removed");
      assert(document.querySelector('a[href="/acme/widgets/pull/7/checks"]').textContent.trim() === "Checks", "checks tab restored");
      GitLabLook.render(document, { enabled: true, commentOrder: "asc" });
      document.body.dataset.glSearch = "";

      document.body.dataset.glPath = "/acme/widgets/pull/7";
      document.title = "Add widget by octocat · Pull Request #7 · acme/widgets · GitHub";
      document.body.innerHTML = [
        "<h2>Conversation</h2>",
        '<div class="js-discussion">',
        '<div class="js-comment-container" id="desc">Description</div>',
        '<div class="js-timeline-item" id="c1">Comment one</div>',
        '<div class="js-timeline-item" id="sys">force-pushed</div>',
        '<div class="js-timeline-item" id="c2">Comment two</div>',
        '<div class="js-timeline-item" id="c3">Comment three',
        '<div class="js-comments-holder">',
        '<div class="timeline-comment-group" id="r1">Reply one</div>',
        '<div class="timeline-comment-group" id="r2">Reply two</div>',
        "</div></div>",
        "</div>",
        '<div id="issue-comment-box">Composer</div>',
      ].join("");
      GitLabLook.render(document, { enabled: true, commentOrder: "asc" });
      function timelineIds() {
        return [...document.querySelectorAll(".js-timeline-item")].map((node) => node.id).join(",");
      }
      function replyIds() {
        return [...document.querySelectorAll(".timeline-comment-group")].map((node) => node.id).join(",");
      }
      assert(timelineIds() === "c1,sys,c2,c3", "oldest timeline: " + timelineIds());
      assert(replyIds() === "r1,r2", "oldest replies: " + replyIds());
      assert(document.querySelector(".js-discussion").firstElementChild.id === "desc", "description stays first");
      assert(document.body.lastElementChild.id === "issue-comment-box", "composer stays last");
      assert(document.getElementById("gl-comment-order"), "order control");
      assert(document.title.indexOf("Merge request #7") > -1, "pr title: " + document.title);

      document.querySelector("#gl-comment-order button[data-order='desc']").click();
      assert(timelineIds() === "c3,c2,sys,c1", "newest timeline: " + timelineIds());
      assert(replyIds() === "r2,r1", "newest replies: " + replyIds());
      assert(document.querySelector(".js-discussion").firstElementChild.id === "desc", "description pinned");
      assert(document.body.lastElementChild.id === "issue-comment-box", "composer pinned");
      assert(document.querySelector("#gl-comment-order button[data-order='desc']").getAttribute("aria-pressed") === "true", "newest pressed");

      document.querySelector("#gl-comment-order button[data-order='asc']").click();
      assert(timelineIds() === "c1,sys,c2,c3", "restored timeline: " + timelineIds());
      assert(replyIds() === "r1,r2", "restored replies: " + replyIds());

      document.body.dataset.glPath = "/acme/widgets/pull/7/files";
      GitLabLook.render(document, { enabled: true, commentOrder: "desc" });
      assert(!document.getElementById("gl-comment-order"), "control hidden on files tab");
      assert(replyIds() === "r2,r1", "files tab replies reversed");

      document.body.dataset.glPath = "/acme/widgets/security/dependabot";
      document.body.innerHTML = [
        '<div class="Box-row">',
        '<a href="/acme/widgets/security/dependabot/7">Prototype Pollution in lodash</a>',
        "<span>high</span><span>package.json</span><span>GHSA-35jh-r3h4-6jhm</span><span>&lt; 4.17.21</span>",
        "</div>",
        '<div class="Box-row">',
        '<a href="/acme/widgets/security/dependabot/8">Dismissed ReDoS in minimatch</a>',
        "<span>medium</span><span>package-lock.json</span>",
        "</div>",
      ].join("");
      GitLabLook.render(document, { enabled: true, commentOrder: "asc" });
      const parsed = GitLabLook.parseDependabotAlerts(document, GitLabLook.parseRepo("/acme/widgets/security/dependabot"));
      assert(parsed.length === 2, "parsed dependabot alerts: " + parsed.length);
      assert(parsed[0].package === "lodash" && parsed[0].severity === "high" && parsed[0].state === "open", "open lodash alert");
      assert(parsed[1].state === "closed", "dismissed alert closed");

      document.body.dataset.glPath = "/acme/widgets/pull/7";
      document.body.dataset.glHash = "";
      document.body.innerHTML = [
        '<nav><a href="/acme/widgets/pull/7">Conversation</a><a href="/acme/widgets/pull/7/checks">Checks</a></nav>',
        '<div id="partial-discussion-sidebar"><div class="discussion-sidebar-item">Reviewers</div></div>',
        '<div class="js-discussion"><div class="js-comment-body">Use lodash in widgets</div></div>',
      ].join("");
      GitLabLook.render(document, { enabled: true, commentOrder: "asc" });
      const security = document.getElementById("gl-mr-security");
      assert(security, "merge request security console");
      assert(document.getElementById("partial-discussion-sidebar").firstElementChild.id === "gl-mr-security", "security in the right sidebar");
      assert(security.querySelector(".gl-vuln").textContent === "lodash", "dependabot package highlighted");
      assert(security.querySelector(".gl-severity-high").textContent === "high", "finding severity");
      assert(security.textContent.indexOf("package.json") > -1, "finding manifest");
      assert(document.getElementById("gl-security-tab").textContent.trim() === "Security", "security tab on conversation");
      assert(!security.classList.contains("is-expanded"), "overview console is compact");
      document.body.dataset.glHash = "#gl-security";
      GitLabLook.render(document, { enabled: true, commentOrder: "asc" });
      assert(document.getElementById("gl-mr-security").classList.contains("is-expanded"), "security tab expands console");
      assert(document.getElementById("gl-security-tab").getAttribute("aria-current") === "page", "security tab current");
      document.body.dataset.glHash = "";

      document.body.dataset.glFile = "package.json";
      document.body.dataset.glPath = "/acme/widgets/blob/main/package.json";
      document.body.innerHTML = [
        '<div id="LC1" data-testid="code-cell">"lodash": "^4.17.20",</div>',
        '<div id="LC2" data-testid="code-cell">"lodash": "4.17.21",</div>',
        '<div id="LC3" data-testid="code-cell">"left-pad": "1.0.0",</div>',
      ].join("");
      GitLabLook.render(document, { enabled: true, commentOrder: "asc" });
      assert(document.querySelector("#LC1 .gl-vuln").textContent === "lodash", "vulnerable dependency highlighted");
      assert(document.querySelector("#LC1").classList.contains("gl-vuln-line"), "vulnerable line marked");
      assert(!document.querySelector("#LC2 .gl-vuln"), "patched lodash left alone");
      assert(!document.querySelector("#LC3 .gl-vuln"), "unrelated dependency left alone");

      document.body.dataset.glFile = "README.md";
      document.body.innerHTML = '<div id="LC1" data-testid="code-cell">See lodash and GHSA-35jh-r3h4-6jhm</div>';
      GitLabLook.render(document, { enabled: true, commentOrder: "asc" });
      const readmeMarks = [...document.querySelectorAll("#LC1 .gl-vuln")].map((node) => node.textContent);
      assert(readmeMarks.join(",") === "GHSA-35jh-r3h4-6jhm", "only the advisory id is highlighted in prose: " + readmeMarks.join(","));

      document.body.dataset.glFile = "";
      document.body.dataset.glPath = "/acme/widgets/actions/runs/42/job/4";
      document.body.innerHTML = [
        "<check-step>",
        '<div class="js-log-line">npm WARN lodash@4.17.20 is vulnerable</div>',
        '<div class="js-log-line">installed lodash@4.17.21</div>',
        '<div class="js-log-line">echo hello</div>',
        "</check-step>",
      ].join("");
      GitLabLook.render(document, { enabled: true, commentOrder: "asc" });
      const logLines = [...document.querySelectorAll(".js-log-line")];
      assert(logLines[0].querySelector(".gl-vuln").textContent === "lodash", "vulnerable log line highlighted");
      assert(logLines[0].querySelector(".gl-vuln-note").textContent.indexOf("lodash") > -1, "log severity note");
      assert(!logLines[1].querySelector(".gl-vuln"), "patched version in the log left alone");
      assert(!logLines[2].querySelector(".gl-vuln"), "unrelated log line left alone");
      GitLabLook.render(document, { enabled: false, commentOrder: "asc" });
      assert(!document.querySelector(".gl-vuln"), "highlights removed when the skin is off");
      GitLabLook.render(document, { enabled: true, commentOrder: "asc" });
      assert(document.querySelector(".js-log-line .gl-vuln"), "highlights return with the skin");

      document.body.dataset.glPath = "/acme/widgets";
      document.title = "Pull requests · acme/widgets · GitHub";
      document.body.innerHTML = "<h1>Pull requests</h1><nav aria-label=\"Repository\"></nav>";
      GitLabLook.render(document, { enabled: true, commentOrder: "asc" });
      assert(document.querySelector("h1").textContent === "Merge requests", "heading skinned before restore");
      GitLabLook.render(document, { enabled: false, commentOrder: "asc" });
      assert(!document.documentElement.classList.contains("gl-look"), "skin off");
      assert(!document.getElementById("gl-sidebar"), "sidebar removed");
      assert(document.querySelector("h1").textContent === "Pull requests", "heading restored");
      assert(document.title === "Pull requests · acme/widgets · GitHub", "title restored: " + document.title);
      } catch (error) {
        failures.push("exception: " + (error && error.stack ? error.stack : error));
      }

      document.documentElement.dataset.result = failures.length ? "fail" : "pass";
      document.body.innerHTML = '<pre id="out"></pre>';
      document.getElementById("out").textContent = (failures.length ? "FAIL\n" : "PASS\n") + failures.join("\n");
    </script>
  </body>
</html>
